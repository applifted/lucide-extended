name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # npm Trusted Publishing and provenance
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@11

      # No dependency install scripts run in the job that can publish.
      - run: npm ci --ignore-scripts
      - run: npm run build

      # Opens a "Version packages" PR when there are changesets. It does not publish:
      # releases are staged below and approved by a maintainer on npmjs.com with 2FA.
      - id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stages the version in package.json unless it is already published or already staged.
      # The git tag v<version> marks a version as staged, so later pushes to main don't stage it again.
      # No NPM_TOKEN: authentication comes from npm Trusted Publishing via the OIDC token.
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already published."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "$name@$version is already staged. Approve it on npmjs.com."
          else
            npm stage publish --provenance
            git tag "v$version"
            git push origin "v$version"
          fi

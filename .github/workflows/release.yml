name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # npm Trusted Publishing and provenance
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@11

      # No dependency install scripts run in the job that can publish.
      - run: npm ci --ignore-scripts
      - run: npm run build

      # Opens a "Version packages" PR when there are changesets. It does not publish:
      # releases are staged below and approved by a maintainer on npmjs.com with 2FA.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stages each public package's version unless it is already published or already staged.
      # The git tag <name>@<version> marks a version as staged, so later pushes to main don't stage it again.
      # (0.4.0 and earlier used v<version> tags; those versions are all published.)
      # A package that isn't on npm yet is skipped: its first publish is manual (CONTRIBUTING.md).
      # A package that fails to stage doesn't stop the others; the job fails at the end, and a
      # re-run skips the packages already staged.
      # No NPM_TOKEN: authentication comes from npm Trusted Publishing via the OIDC token.
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          failed=()
          for dir in packages/*/; do
            if [ "$(node -p "require('./${dir}package.json').private === true")" = true ]; then continue; fi
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            tag="$name@$version"
            if [ -n "$(npm view "$tag" version 2>/dev/null)" ]; then
              echo "$tag is already published."
            elif [ -z "$(npm view "$name" name 2>/dev/null)" ]; then
              echo "::warning::$name is not on npm yet. Publish $tag manually (CONTRIBUTING.md), then set up Trusted Publishing."
            elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag is already staged. Approve it on npmjs.com."
            elif (cd "$dir" && npm stage publish --provenance); then
              git tag "$tag"
              git push origin "$tag"
            else
              echo "::error::Staging $tag failed. For an authentication error, check the package's Trusted Publisher on npmjs.com."
              failed+=("$tag")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Not staged: ${failed[*]}. Fix the cause, then re-run this job."
            exit 1
          fi
